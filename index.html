<title>Kaiten Neta Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500&family=Roboto+Mono:wght@500&display=swap">
<style>
:root{
  --shari:#F8F5EF; --shari-2:#ECE6DA; --ink:#15191B; --ink-2:#414749;
  --muted:#7E857F; --line:#DCD6C9; --surface:#FFFFFF;
  --belt:#D8D2C4; --belt-edge:#BFB8A7; --counter:#E7E0D1;
  --maguro:#BF3A2F; --sora:#3A6B89; --ebi:#D39C18; --wasabi:#69893B; --nori:#293832; --ki:#956645;
  --bg:var(--shari); --fg:var(--ink); --fg-2:var(--ink-2); --border:var(--line);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111416; --fg:#EDE8DD; --fg-2:#B4B9B3; --muted:#8C928C;
    --surface:#1A1E20; --border:#2C3234; --shari-2:#242A2C;
    --belt:#232A2C; --belt-edge:#333B3D; --counter:#1A1E20;
    --maguro:#E3604F; --sora:#72A6C6; --ebi:#E6BD4C; --wasabi:#9FC266; --ki:#C1906A; --nori:#8FA79B;
  }
}
:root[data-theme="dark"]{
  --bg:#111416; --fg:#EDE8DD; --fg-2:#B4B9B3; --muted:#8C928C;
  --surface:#1A1E20; --border:#2C3234; --shari-2:#242A2C;
  --belt:#232A2C; --belt-edge:#333B3D; --counter:#1A1E20;
  --maguro:#E3604F; --sora:#72A6C6; --ebi:#E6BD4C; --wasabi:#9FC266; --ki:#C1906A; --nori:#8FA79B;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);
  font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;line-height:1.7}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;
  display:flex;flex-direction:column;gap:18px}
h1{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:25px;line-height:1.25;
  margin:0;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--fg-2);font-size:13.5px}
.lead b{color:var(--fg);font-weight:500}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:500;margin:0}

/* レーン */
.lane{position:relative;background:var(--belt);border-radius:16px;
  border-block:3px solid var(--belt-edge);padding:18px 0;overflow:hidden}
.lane::before,.lane::after{content:"";position:absolute;left:0;right:0;height:10px;
  background:repeating-linear-gradient(90deg,var(--belt-edge) 0 16px,transparent 16px 34px);opacity:.55}
.lane::before{top:0} .lane::after{bottom:0}
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px 16px;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{height:0}
.lane-empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:13px}

/* 皿 */
.plate{scroll-snap-align:center;flex:0 0 auto;width:150px;display:flex;flex-direction:column;
  align-items:center;gap:8px}
.dish{position:relative;width:150px;height:150px;border-radius:50%;
  background:var(--surface);border:8px solid var(--pc,var(--muted));
  box-shadow:0 5px 14px rgba(0,0,0,.14);overflow:hidden;display:grid;place-items:center}
.dish img{width:100%;height:100%;object-fit:cover}
.dish .del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
  border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;cursor:pointer;padding:0;z-index:2}
.dish.add{background:transparent;border-style:dashed;border-color:var(--belt-edge);
  box-shadow:none;cursor:pointer;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.dish.add:hover{border-color:var(--muted);color:var(--fg-2)}
.tag{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:13px;
  text-align:center;color:var(--fg-2);min-height:1.7em}

/* 判定結果 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;
  border-left:5px solid var(--gcol,var(--muted))}
.rname{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:31px;line-height:1.18;margin:2px 0 0}
.ren{font-size:14px;color:var(--fg-2);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;
  padding:4px 9px;border-radius:99px;border:1px solid var(--border);color:var(--fg-2)}
.chip.plate-dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gcol,var(--muted))}
.chip.warn{border-color:var(--maguro);color:var(--maguro)}
.chip.ok{border-color:var(--wasabi);color:var(--wasabi)}
.meter{height:5px;border-radius:3px;background:var(--shari-2);overflow:hidden;margin-top:13px}
.meter i{display:block;height:100%;background:var(--gcol,var(--muted))}
.conf{font-family:"Roboto Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted);
  margin-top:6px;font-variant-numeric:tabular-nums}
.cands{margin:11px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.cands li{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;
  padding-bottom:7px;border-bottom:1px solid var(--border)}
.cands li:last-child{border-bottom:0;padding-bottom:0}
.cands span:last-child{font-family:"Roboto Mono",monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin:12px 0 0;padding-top:12px;border-top:1px solid var(--border)}

.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 auto;min-width:130px;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;
  font-size:15px;padding:12px 16px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--fg);cursor:pointer;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--maguro);border-color:var(--maguro);color:#fff}
.btn.primary:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--wasabi);outline-offset:2px}
input[type=file]{display:none}
#status{font-family:"Roboto Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);margin:0}

.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px 14px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2)}
.legend i{width:11px;height:11px;border-radius:50%;flex:none}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
footer{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.75}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.plate,.dish{width:128px}.dish{height:128px}}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Conveyor-belt sushi · 回転寿司</p>
    <h1>これ、何のネタ？</h1>
    <p class="lead">皿を撮ると、ネタの名前と<b>生で食べるものかどうか</b>を調べます。写真は端末から出ません。</p>
  </header>

  <section class="lane" aria-label="撮った皿">
    <div class="rail" id="rail"></div>
    <p class="lane-empty" id="laneEmpty">皿を撮ると、ここに並びます。</p>
  </section>

  <div class="row">
    <label class="btn" for="cam">皿を撮る / Camera</label>
    <label class="btn" for="pick">選ぶ / Choose</label>
  </div>
  <input id="cam" type="file" accept="image/*" capture="environment" multiple>
  <input id="pick" type="file" accept="image/*" multiple>
  <div class="row">
    <button class="btn primary" id="go" disabled>判定する / Identify</button>
    <button class="btn" id="sample">サンプル3枚で試す</button>
  </div>
  <p id="status">モデルを読み込んでいます…</p>

  <section class="card" id="result" hidden></section>

  <section class="panel">
    <p class="eyebrow">ふちの色でジャンルが分かります</p>
    <div class="legend" id="legend"></div>
    <p class="note">同じ皿を2〜3枚撮ると当たりやすくなります。自信がないときは、ネタ名を言わずにジャンルだけ答えます。</p>
  </section>

  <footer>ブラウザの中だけで判定します。538枚で試して、ネタ名は74%、ジャンルは67%が当たりました。<br>
  アレルギーは店員に確かめてください。</footer>
</div>

<script src="ort.wasm.min.js"></script>
<script>
const GCOL = {maguro_salmon:"--maguro", shiromi_aomono:"--sora", ika_tako_ebi:"--ebi",
  kai_nimono_tamago:"--wasabi", gunkan:"--nori", maki_sonota:"--ki"};
const ALLERGEN = {salmon:["サーモン","Salmon"], shrimp:["えび","Shrimp"], crab:["かに","Crab"],
  squid:["いか","Squid"], octopus:["たこ","Octopus"], scallop:["帆立","Scallop"],
  shellfish:["貝類","Shellfish"], abalone:["あわび","Abalone"], mackerel:["さば","Mackerel"],
  egg:["卵","Egg"], milk:["乳","Milk"], soy:["大豆","Soy"], wheat:["小麦","Wheat"]};
let GENRE_TH = 0.45;
let META = null, SESSION = null, SHOTS = [];
const $ = id => document.getElementById(id);
const setStatus = t => { $("status").textContent = t; };
const gcolor = g => `var(${GCOL[g] || "--muted"})`;

async function boot(){
  try{
    ort.env.wasm.wasmPaths = "./";
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.simd = true;
    META = await (await fetch("meta.json")).json();
    if(META.genre_threshold) GENRE_TH = META.genre_threshold;
    drawLegend();
    SESSION = await ort.InferenceSession.create("sushi-model.wasm", {executionProviders:["wasm"]});
    setStatus("準備できました。");
    renderLane();
  }catch(e){
    setStatus("モデルを読み込めませんでした: " + e.message);
  }
}

function drawLegend(){
  const L = $("legend"); L.innerHTML = "";
  for(const [k,v] of Object.entries(META.genres)){
    const n = META.classes.filter(c => META.items[c].genre === k).length;
    const d = document.createElement("div");
    d.innerHTML = `<i style="background:${gcolor(k)}"></i><span>${v.ja} <span style="color:var(--muted)">${n}種</span></span>`;
    L.appendChild(d);
  }
}

function renderLane(){
  const rail = $("rail"); rail.innerHTML = "";
  SHOTS.forEach((s, i) => {
    const wrap = document.createElement("div"); wrap.className = "plate";
    const dish = document.createElement("div"); dish.className = "dish";
    dish.style.setProperty("--pc", gcolor(s.genre));
    const img = document.createElement("img"); img.src = s.url; img.alt = `${i+1}皿目`;
    const del = document.createElement("button");
    del.className = "del"; del.type = "button"; del.textContent = "×";
    del.setAttribute("aria-label", `${i+1}皿目を外す`);
    del.onclick = () => { if(s.blob) URL.revokeObjectURL(s.url); SHOTS.splice(i,1); renderLane(); };
    dish.append(img, del);
    const tag = document.createElement("p"); tag.className = "tag";
    tag.textContent = s.label || "";
    wrap.append(dish, tag); rail.appendChild(wrap);
  });
  if(SHOTS.length < 6){
    const wrap = document.createElement("div"); wrap.className = "plate";
    const add = document.createElement("label");
    add.className = "dish add"; add.setAttribute("for", "cam");
    add.textContent = SHOTS.length ? "もう1枚" : "＋ 皿を撮る";
    const tag = document.createElement("p"); tag.className = "tag"; tag.textContent = "";
    wrap.append(add, tag); rail.appendChild(wrap);
  }
  $("laneEmpty").hidden = SHOTS.length > 0;
  $("go").disabled = SHOTS.length === 0 || !SESSION;
}

function addFiles(files){
  for(const f of files){
    if(SHOTS.length >= 6) break;
    SHOTS.push({url: URL.createObjectURL(f), blob: true});
  }
  renderLane();
}
$("cam").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("pick").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("sample").onclick = () => {
  SHOTS.forEach(s => s.blob && URL.revokeObjectURL(s.url));
  SHOTS = [1,2,3].map(i => ({url:`sample${i}.jpg`}));
  renderLane(); run();
};

function toTensor(img, flip){
  const S = 224, R = 256;
  const c = document.createElement("canvas"); c.width = S; c.height = S;
  const x = c.getContext("2d", {willReadFrequently:true});
  const scale = R / Math.min(img.width, img.height);
  const w = img.width * scale, h = img.height * scale;
  if(flip){ x.translate(S, 0); x.scale(-1, 1); }
  x.drawImage(img, (S - w)/2, (S - h)/2, w, h);
  const px = x.getImageData(0,0,S,S).data;
  const mean = [0.485,0.456,0.406], std = [0.229,0.224,0.225];
  const out = new Float32Array(3*S*S);
  for(let i=0;i<S*S;i++)
    for(let ch=0;ch<3;ch++)
      out[ch*S*S+i] = ((px[i*4+ch]/255) - mean[ch]) / std[ch];
  return new ort.Tensor("float32", out, [1,3,S,S]);
}
const loadImg = src => new Promise((res, rej) => {
  const im = new Image(); im.crossOrigin = "anonymous";
  im.onload = () => res(im); im.onerror = rej; im.src = src;
});
function softmax(a){
  const m = Math.max(...a);
  const e = a.map(v => Math.exp(v - m));
  const s = e.reduce((p,q) => p+q, 0);
  return e.map(v => v/s);
}

async function run(){
  if(!SESSION || !SHOTS.length) return;
  $("go").disabled = true;
  setStatus(`${SHOTS.length}皿を調べています…`);
  const n = META.classes.length, acc = new Array(n).fill(0);
  let runs = 0;
  try{
    for(const s of SHOTS){
      const img = await loadImg(s.url);
      const per = new Array(n).fill(0);
      for(const flip of [false, true]){
        const o = await SESSION.run({input: toTensor(img, flip)});
        const p = softmax(Array.from(o.logits.data));
        for(let i=0;i<n;i++){ per[i] += p[i]/2; acc[i] += p[i]; }
        runs++;
      }
      const bi = per.indexOf(Math.max(...per));
      s.label = META.items[META.classes[bi]].ja;   // 皿ごとの見立て
      s.genre = META.items[META.classes[bi]].genre;
    }
  }catch(e){
    setStatus("判定できませんでした: " + e.message);
    $("go").disabled = false; return;
  }
  renderLane();
  show(acc.map(v => v/runs));
  setStatus(`${SHOTS.length}皿を${runs}通りに見て平均しました。`);
  $("go").disabled = false;
}

function show(prob){
  const cls = META.classes;
  const order = prob.map((p,i) => [p,i]).sort((a,b) => b[0]-a[0]);
  const [p1, i1] = order[0];
  const top = cls[i1], item = META.items[top];
  const byGenre = {};
  cls.forEach((c,i) => { const g = META.items[c].genre; if(g) byGenre[g] = (byGenre[g]||0) + prob[i]; });
  const gBest = Object.entries(byGenre).sort((a,b) => b[1]-a[1])[0];

  let mode, name, en, genre, conf;
  if(top !== "unknown" && p1 >= (item.threshold ?? 0.45)){
    mode = "class"; name = item.ja; en = item.en; genre = item.genre; conf = p1;
  }else if(gBest && gBest[1] >= GENRE_TH){
    mode = "genre"; genre = gBest[0];
    name = META.genres[genre].ja; en = META.genres[genre].en; conf = gBest[1];
  }else{
    mode = "unknown"; name = "判別できません"; en = "Not sure"; genre = null; conf = p1;
  }

  const R = $("result"); R.hidden = false;
  R.style.setProperty("--gcol", gcolor(genre));

  let chips = "";
  if(genre) chips += `<span class="chip plate-dot">${META.genres[genre].ja}</span>`;
  if(mode === "class"){
    if(item.raw === true) chips += `<span class="chip warn">生もの / Raw</span>`;
    if(item.raw === false) chips += `<span class="chip ok">加熱済み / Cooked</span>`;
    for(const a of (item.allergen || [])){
      const t = ALLERGEN[a] || [a,a];
      chips += `<span class="chip warn">${t[0]} / ${t[1]}</span>`;
    }
    if(!(item.allergen || []).length && item.raw !== null)
      chips += `<span class="chip">特定原材料は使いません</span>`;
  }
  let sub = "";
  if(mode === "class" && item.sub_labels?.length){
    sub = `<p class="note">断面の色で中身が変わります。<br>` +
      item.sub_labels.map(s => `${s.ja}（${s.cut_color}）`).join(" ／ ") + `</p>`;
  }
  const listed = mode === "class" ? order.slice(1,4) : order.slice(0,5);
  const cands = listed.filter(([p]) => p > 0.01)
    .map(([p,i]) => `<li><span>${META.items[cls[i]].ja}</span><span>${(p*100).toFixed(0)}%</span></li>`).join("");

  R.innerHTML =
    `<p class="eyebrow">判定</p>` +
    `<p class="ren">${en}${mode === "genre" ? " — ネタ名までは絞れませんでした" : ""}</p>` +
    `<h2 class="rname">${name}</h2>` +
    `<div class="chips">${chips}</div>` +
    `<div class="meter"><i style="width:${Math.round(conf*100)}%"></i></div>` +
    `<p class="conf">この答えの確からしさ ${(conf*100).toFixed(0)}%</p>` +
    (cands ? `<p class="eyebrow" style="margin-top:15px">${mode === "class" ? "他の候補" : "候補"}</p><ul class="cands">${cands}</ul>` : "") +
    sub +
    (mode !== "class" ? `<p class="note">角度を変えて1枚足すと、絞れることがあります。</p>` : "");
  R.scrollIntoView({behavior:"smooth", block:"nearest"});
}

$("go").onclick = run;
renderLane();
boot();
</script>
